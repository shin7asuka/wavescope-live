<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="黄金、白银与WTI原油的动态5浪7浪结构分析仪表盘" />
    <title>WaveScope Live | 动态浪型分析</title>
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=jet-brains-mono@400,500,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 36 36" aria-label="WaveScope">
            <path d="M4 24 11 11l7 15 7-18 7 13" />
            <circle cx="29" cy="8" r="2.5" />
          </svg>
          <div><b>WaveScope</b><span>LIVE STRUCTURE</span></div>
        </div>
        <nav class="asset-list" aria-label="品种选择">
          <button class="asset-button active" data-asset="gold" data-testid="button-asset-gold">
            <span class="asset-icon gold">AU</span><span><b>黄金</b><small>GC · COMEX</small></span>
          </button>
          <button class="asset-button" data-asset="silver" data-testid="button-asset-silver">
            <span class="asset-icon silver">AG</span><span><b>白银</b><small>SI · COMEX</small></span>
          </button>
          <button class="asset-button" data-asset="wti" data-testid="button-asset-wti">
            <span class="asset-icon oil">CL</span><span><b>WTI 原油</b><small>CL · NYMEX</small></span>
          </button>
        </nav>
        <div class="sidebar-note">
          <span class="eyebrow">分析原则</span>
          <p>确认后计数，不使用未来数据。结构概率是动态评分，不是收益保证。</p>
        </div>
        <button class="theme-toggle" data-testid="button-theme" aria-label="切换主题">
          <span>显示模式</span><span id="themeIcon">◐</span>
        </button>
      </aside>

      <header class="topbar">
        <div>
          <span class="eyebrow">实时结构终端</span>
          <h1 id="assetTitle" data-testid="text-asset-title">黄金 · GC</h1>
        </div>
        <div class="top-status">
          <div class="live-chip"><i></i><span id="feedStatus">行情连接中</span></div>
          <div class="clock" id="clock" data-testid="text-clock">--:--:--</div>
        </div>
      </header>

      <main class="main">
        <section class="kpi-row" aria-label="市场概览">
          <article class="quote-card">
            <span class="eyebrow">最新价</span>
            <div class="price-line"><strong id="price" data-testid="text-price">—</strong><span id="unit">USD/oz</span></div>
            <div id="delta" class="delta flat" data-testid="text-delta">等待数据</div>
          </article>
          <article class="status-card">
            <span class="eyebrow">最高概率结构</span>
            <strong id="primaryWave" data-testid="text-primary-wave">计算中</strong>
            <span id="primaryStage">正在识别当前阶段</span>
          </article>
          <article class="status-card">
            <span class="eyebrow">结构置信度</span>
            <div class="confidence"><strong id="confidence" data-testid="text-confidence">—</strong><span>%</span></div>
            <div class="confidence-track"><i id="confidenceBar"></i></div>
          </article>
          <article class="status-card">
            <span class="eyebrow">失效参考</span>
            <strong id="invalidation" data-testid="text-invalidation">—</strong>
            <span>最近确认摆动点外侧</span>
          </article>
        </section>

        <section class="workspace">
          <article class="chart-panel">
            <div class="panel-head">
              <div>
                <span class="eyebrow">价格结构</span>
                <h2>动态浪型路径</h2>
              </div>
              <div class="timeframes" role="group" aria-label="时间周期">
                <button class="tf active" data-interval="1m" data-testid="button-timeframe-1m">1分</button>
                <button class="tf" data-interval="5m" data-testid="button-timeframe-5m">5分</button>
                <button class="tf" data-interval="15m" data-testid="button-timeframe-15m">15分</button>
                <button class="tf" data-interval="1h" data-testid="button-timeframe-1h">1时</button>
              </div>
            </div>
            <div class="legend">
              <button class="legend-item active" data-layer="wave5" data-testid="button-layer-wave5"><i class="c5"></i>5浪推动</button>
              <button class="legend-item active" data-layer="wave7" data-testid="button-layer-wave7"><i class="c7"></i>7浪调整</button>
              <button class="legend-item active" data-layer="abc" data-testid="button-layer-abc"><i class="ca"></i>ABC备选</button>
            </div>
            <div id="chart" data-testid="chart-market"></div>
            <div class="chart-footer">
              <span id="dataTime">数据时间 —</span>
              <span id="analysisTime">分析时间 —</span>
              <span>每秒重算</span>
            </div>
          </article>

          <aside class="scenario-panel">
            <div class="panel-head compact">
              <div><span class="eyebrow">候选路径</span><h2>概率分布</h2></div>
              <span class="model-tag">启发式</span>
            </div>
            <div id="scenarios" class="scenario-list" data-testid="list-scenarios"></div>
            <div class="signal-box">
              <span class="eyebrow">当前判断</span>
              <p id="signalText">等待足够K线形成可识别结构。</p>
              <dl>
                <div><dt>趋势</dt><dd id="trendState">—</dd></div>
                <div><dt>动量</dt><dd id="momentumState">—</dd></div>
                <div><dt>摆动数</dt><dd id="pivotCount">—</dd></div>
              </dl>
            </div>
          </aside>
        </section>

        <footer class="disclosure">
          <span>数据代理：GC、SI、CL连续期货</span>
          <span>概率为结构评分，尚非历史校准概率</span>
          <span>仅供研究，不构成投资建议</span>
        </footer>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
